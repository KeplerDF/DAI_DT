name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["master"] # Runs automatically whenever you push to master
  workflow_dispatch:   # Allows manual trigger from the Actions tab

# Grants necessary GITHUB_TOKEN permissions to deploy pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allows one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "debate-frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./debate-frontend

      - name: Build static export
        run: npm run build
        working-directory: ./debate-frontend

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./debate-frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
